name: CI

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff · mypy · pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    # Postgres real: las pruebas de integracion cubren el checkpointer, la
    # pausa durable y la idempotencia (RNF-01, RNF-02, BR-15).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quoteflow
          POSTGRES_PASSWORD: quoteflow
          POSTGRES_DB: quoteflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quoteflow -d quoteflow"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://quoteflow:quoteflow@localhost:5432/quoteflow
      # RF-10: la suite nunca llama a un LLM externo.
      LLM_MODE: fake

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Instalar dependencias
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Formato
        run: uv run ruff format --check .

      - name: Tipos
        run: uv run mypy app

      - name: Pruebas
        run: uv run pytest -q

  frontend:
    name: Frontend (tsc · vitest · build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Toma la version de pnpm del campo "packageManager" de package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Tipos
        run: pnpm typecheck

      - name: Pruebas
        run: pnpm test

      - name: Build
        run: pnpm build

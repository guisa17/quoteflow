# Publica la demo (modo mock: reglas en el navegador, datos ficticios, sin
# backend ni API keys) en https://guisa17.github.io/quoteflow/
name: Demo en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "backend/app/data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build de la demo
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Build en modo demo bajo /quoteflow/
        run: pnpm build
        env:
          VITE_API_MODE: mock
          VITE_BASE: /quoteflow/

      # Pages no conoce las rutas de la SPA: al recargar /quoteflow/requests/x
      # sirve 404.html, que es la misma app y resuelve la ruta en el navegador.
      - name: Fallback de rutas
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
